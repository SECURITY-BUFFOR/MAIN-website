baseURL = 'https://securitybuffor.com'
locale = 'en-US'
title = 'SECURITY-BUFFOR'
theme = "minimal-black-modified"
enableRobotsTXT = true

# Enable search index generation and web app manifest
[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[params]
  brand = "SECURITY-BUFFOR"
  description = "Independent red team operations, adversary emulation, insider threat assessments, and phishing simulations — authorized, evidence-led offensive security from Poland."
  author = "SECURITY-BUFFOR"
  defaultImage = "images/securitybuffor-social.png"
  keywords = [
    "red team",
    "red team operations",
    "penetration testing",
    "adversary emulation",
    "insider threat assessment",
    "phishing simulation",
    "offensive security",
    "Poland"
  ]

  # Favicon - Place your favicon files in /static/ directory
  # Supported formats: .ico, .png, .svg
  favicon = "favicon.ico"
  appleTouchIcon = "icons/apple-touch-icon.png"

  # Logo (optional)
  logo = "images/logo.png"

  # Project and blog intro text
  projectsIntro = "Tooling built for real engagements — reporting, campaign operations, and operator workflow. Private tools are available on request."

  # Security services
  servicesIntro = "Outcome-led offensive security engagements built around realistic attack paths, controlled execution, and practical remediation. Every assessment is scoped and authorized before testing begins."
  servicesContactEmail = "h4mr3r@securitybuffor.com"
  # Example deliverable linked from the services pages (leave empty to hide).
  servicesSampleReport = "files/sample_report.pdf"

  [params.seo]
    twitterSite = ""
    organizationName = "Security Buffor"
    organizationLogo = "images/logo.png"

  # Web App Manifest Configuration (PWA support)
  [params.manifest]
    themeColor = "#7d1d1d"
    backgroundColor = "#000000"
    categories = ["security", "portfolio", "developer"]

    # Pinned to the files actually present in static/icons/. Without these the
    # template falls back to android-chrome-*/favicon-16x16 names we do not ship.
    [[params.manifest.icons]]
      src = "icons/web-app-manifest-192x192.png"
      sizes = "192x192"
      type = "image/png"
      purpose = "any maskable"

    [[params.manifest.icons]]
      src = "icons/web-app-manifest-512x512.png"
      sizes = "512x512"
      type = "image/png"
      purpose = "any maskable"

    [[params.manifest.icons]]
      src = "icons/apple-touch-icon.png"
      sizes = "180x180"
      type = "image/png"

    [[params.manifest.icons]]
      src = "icons/favicon-96x96.png"
      sizes = "96x96"
      type = "image/png"
    #   src = "/icons/android-chrome-192x192.png"
    #   sizes = "192x192"
    #   type = "image/png"
    #   purpose = "any maskable"

  # Theme Configuration
  [params.theme]
    defaultTheme = "dark"  # Options: "light", "dark", "system"

  # Home Page Configuration
  [params.home]
    sections = ["hero", "services", "projects"]
    servicesTitle = "Offensive security services"
    servicesSubtitle = "Authorized engagements, realistic adversaries, useful outcomes."
    projectsTitle = "Operator toolkit"

  # About Page Alternative Layout Configuration
  [params.about.alt]
    skillsTitle = "Core skills"

    [[params.about.alt.skills]]
      label = "Active Directory"
      icon = "fa-solid fa-sitemap"

    [[params.about.alt.skills]]
      label = "Azure & Entra ID"
      icon = "fa-brands fa-microsoft"

    [[params.about.alt.skills]]
      label = "C2 operations"
      icon = "fa-solid fa-tower-broadcast"

    [[params.about.alt.skills]]
      label = "Malware development"
      icon = "fa-solid fa-bug"

    [[params.about.alt.skills]]
      label = "Defense evasion"
      icon = "fa-solid fa-user-secret"

    [[params.about.alt.skills]]
      label = "Social engineering"
      icon = "fa-solid fa-envelope-open-text"

    [[params.about.alt.skills]]
      label = "C / C++"
      icon = "fa-solid fa-microchip"

    [[params.about.alt.skills]]
      label = "C#"
      icon = "fa-solid fa-code"

    [[params.about.alt.skills]]
      label = "Python"
      icon = "fa-brands fa-python"

    [[params.about.alt.skills]]
      label = "Docker"
      icon = "fa-brands fa-docker"

  # Hero Section Configuration
  [params.hero]
    badge = "Independent offensive security"
    title = "Think like an attacker."
    titleAccent = "Test like one."
    summary = "Red team operations, adversary emulation, and social-engineering assessments — run by a certified operator with enterprise consulting experience, under strict rules of engagement."
    role = "Red Team Specialist & Malware Developer"
    avatar = "images/avatar.png"
    location = "Poland"

    [params.hero.primary]
      label = "View services"
      href = "/services/"

    [params.hero.secondary]
      label = "Scope an engagement"
      href = "mailto:h4mr3r@securitybuffor.com?subject=Security%20engagement%20inquiry"

    # Terminal-style credentials panel next to the hero copy.
    [[params.hero.credentials]]
      label = "Netia S.A."
      value = "2025 – now"

    [[params.hero.credentials]]
      label = "KPMG Poland"
      value = "2021 – 2025"

    [[params.hero.credentials]]
      label = "Focus"
      value = "AD · Azure · C2"

  # Icon Libraries
  [params.icons]
    useFontAwesome = true
    useDevicon = false

  # Social Links
  [[params.social]]
    label = "GitHub"
    url = "https://github.com/SECURITY-BUFFOR"
    icon = "fa-brands fa-github"

  [[params.social]]
    label = "LinkedIn"
    url = "https://www.linkedin.com/in/kgres/"
    icon = "fa-brands fa-linkedin-in"

  [[params.social]]
    label = "Email"
    url = "mailto:h4mr3r@securitybuffor.com"
    icon = "fa-regular fa-envelope"

  # Analytics Configuration
  [params.analytics]
    # Google Analytics (GA4)
    # googleAnalytics = "G-XXXXXXXXXX"

    # Plausible Analytics (privacy-friendly)
    # [params.analytics.plausible]
    #   enabled = true
    #   domain = "yourdomain.com"
    #   scriptUrl = "https://plausible.io/js/script.js"

    # Umami Analytics (self-hosted option)
    # [params.analytics.umami]
    #   enabled = true
    #   scriptUrl = "https://analytics.yourdomain.com/script.js"
    #   websiteId = "your-website-id"

    # Fathom Analytics
    # [params.analytics.fathom]
    #   enabled = true
    #   scriptUrl = "https://cdn.usefathom.com/script.js"
    #   siteId = "YOUR-SITE-ID"

# Navigation Menu
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
    identifier = "home"
    [menu.main.params]
      icon = "fa-solid fa-house"


  [[menu.main]]
    name = "About"
    pageRef = "about"
    weight = 2
    identifier = "about"
    [menu.main.params]
      icon = "fa-solid fa-user"

  [[menu.main]]
    name = "Services"
    pageRef = "services"
    weight = 3
    identifier = "services"
    [menu.main.params]
      icon = "fa-solid fa-crosshairs"

  [[menu.main]]
    name = "Projects"
    pageRef = "projects"
    weight = 4
    identifier = "projects"
    [menu.main.params]
      icon = "fa-regular fa-folder-open"

# Markup Configuration
[markup]
  # Table of Contents
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  # Goldmark Renderer (Markdown)
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

  [markup.goldmark.extensions]
    typographer = true
    linkify = true
    table = true
    strikethrough = true
    taskList = true
    definitionList = true
    footnote = true

    [markup.goldmark.extensions.extras.delete]
      enable = true
    [markup.goldmark.extensions.extras.insert]
      enable = true
    [markup.goldmark.extensions.extras.mark]
      enable = true

  # Syntax Highlighting
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "monokai"
    tabWidth = 2

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Privacy Configuration
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
