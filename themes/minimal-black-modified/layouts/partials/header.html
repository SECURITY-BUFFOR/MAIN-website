<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a href="{{ site.Home.RelPermalink }}" class="site-wordmark" aria-label="{{ .Site.Title }} home">
      <img src="{{ (.Site.Params.logo | default "images/logo.png") | relURL }}" alt="" width="40" height="40">
      <span>{{ .Site.Params.brand | default .Site.Title }}</span>
    </a>
    <div class="site-header__actions">
      <nav class="desktop-nav" aria-label="Primary navigation">
        {{ $current := . }}{{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}" class="nav-link{{ if $current.IsMenuCurrent "main" . }} is-active{{ end }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
      <button type="button" class="hdr-btn hdr-btn--search" aria-label="Search (Ctrl+K)" onclick="window.MinimalSearch && window.MinimalSearch.open()">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M6.8 1.8a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM10.4 10.4l4 4"/></svg>
        <span class="hdr-btn__label">Search</span><kbd>^K</kbd>
      </button>
      {{ partial "dark-toggle.html" . }}
      <button type="button" class="hdr-btn mobile-nav-toggle" aria-label="Open navigation" aria-controls="mobile-navigation" aria-expanded="false" data-mobile-nav-toggle>
        <span class="mobile-nav-toggle__open">Menu</span><span class="mobile-nav-toggle__close">Close</span>
      </button>
    </div>
  </div>
  <nav id="mobile-navigation" class="mobile-nav" aria-label="Mobile navigation" aria-hidden="true" data-mobile-nav>
    {{ $current := . }}{{ range $i, $m := .Site.Menus.main }}<a href="{{ $m.URL | relURL }}"{{ if $current.IsMenuCurrent "main" $m }} class="is-active" aria-current="page"{{ end }}><b>{{ printf "%02d" (add $i 1) }}</b>{{ $m.Name }}<i aria-hidden="true">→</i></a>{{ end }}
  </nav>
</header>
